# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: ccstatus

builds:
  - id: ccstatus
    main: ./cmd/ccstatus
    binary: ccstatus
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^chore: release"

release:
  github:
    owner: moonD4rk
    name: ccstatus
  draft: false
  prerelease: auto

homebrew_casks:
  - name: ccstatus
    binaries:
      - ccstatus
    homepage: "https://github.com/moonD4rk/ccstatus"
    description: "Customizable status line formatter for Claude Code CLI"
    skip_upload: auto
    repository:
      owner: moonD4rk
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: "moond4rk-ci[bot]"
      email: "299850723+moond4rk-ci[bot]@users.noreply.github.com"
    commit_msg_template: "brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    hooks:
      post:
        # The binary is not signed or notarized, so Gatekeeper would refuse to run it.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/ccstatus"]
          end
